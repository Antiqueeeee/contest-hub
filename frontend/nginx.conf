# X-Forwarded-Proto 决定后端 force_https 的判定，必须只信可控来源：
#
# - 默认（本项目直接对外，无外层代理）：强制使用 $scheme，忽略客户端
#   自报的 X-Forwarded-Proto（否则任何人加一行请求头即可绕过 HTTPS 强制）。
# - 部署在外层 HTTPS 反向代理之后（外层代理覆写该头）：把下面的 map
#   切换为透传模式，并确保外层代理总是覆写而非透传客户端原值。
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    # 外层 HTTPS 代理部署时启用下面这行（并确保外层代理总是覆写该头）：
    # "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：SPA 静态构建无 inline 脚本；React/编辑器组件使用 inline style，故 style 放行 unsafe-inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Upload limit (matches backend upload_max_size_mb with headroom)
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded images via backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # Security: only allow GET/HEAD, prevent execution
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
}
